name: Bug report
description: Report incorrect or unsafe Vericopy behavior
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Follow SECURITY.md for private reporting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste `vericopy version` with sensitive paths removed.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows PowerShell
        - Windows Git Bash or MINGW
        - Windows Cygwin
        - macOS
        - Linux
        - WSL
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed and expected behavior
      description: Include the diagnostic code. Replace personal paths, hosts, and users with neutral examples.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction. Never paste credentials or private keys.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Doctor output
      description: Paste sanitized `vericopy doctor --json` output.

