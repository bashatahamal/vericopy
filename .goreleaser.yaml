version: 2

project_name: vericopy

builds:
  - id: vericopy
    main: ./cmd/vericopy
    binary: vericopy
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - >-
        -s -w
        -X github.com/bashatahamal/vericopy/internal/version.Version={{.Version}}
        -X github.com/bashatahamal/vericopy/internal/version.Commit={{.FullCommit}}
        -X github.com/bashatahamal/vericopy/internal/version.BuildDate={{.CommitDate}}

archives:
  - ids:
      - vericopy
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  draft: true

